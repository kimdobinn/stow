# XcodeGen: `cd ios && xcodegen generate` (never edit Stow.xcodeproj by hand).
# Needs ios/Vendor first: ios/scripts/fetch-python.sh
name: Stow
options:
  bundleIdPrefix: dev.stow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.6"
packages:
  # The data layer: models, Firebase over REST, sync and downloads (tested with `swift test`).
  StowKit:
    path: StowKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Main-actor by default, as in Xcode's app template; background code says `nonisolated`.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: "1"
    # Signed for a free Apple ID by Xcode or re-signed by SideStore/AltStore: no capabilities needed.
    CODE_SIGN_STYLE: Automatic
    # The Python build phase reads ios/Vendor and writes into the app bundle.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Python's platform files are per architecture; simulators on Apple silicon are arm64.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  Stow:
    type: application
    platform: iOS
    sources:
      - path: Stow
        excludes:
          - "**/*.py"
          - "App/Info.plist"
    dependencies:
      - framework: Vendor/Python.xcframework
        embed: true
      - sdk: JavaScriptCore.framework
      - sdk: AVFoundation.framework
      - package: StowKit
    info:
      path: Stow/App/Info.plist
      properties:
        CFBundleDisplayName: Stow
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Playback on the lock screen; polling for new videos; downloads in the background.
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - dev.stow.ios.refresh
          - dev.stow.ios.downloads
        NSCameraUsageDescription: Stow uses the camera to scan the pairing code on your Mac.
        # stow://pair?… links (the Mac's pairing QR code opened from the Camera app).
        CFBundleURLTypes:
          - CFBundleURLName: dev.stow.ios.pair
            CFBundleURLSchemes:
              - stow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.stow.ios
        PRODUCT_NAME: Stow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Stow/YtDlp/Bridge/Stow-Bridging-Header.h
        # Python's headers ask for this.
        GCC_C_LANGUAGE_STANDARD: gnu11
        CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
    postBuildScripts:
      - name: Install Python
        script: '"$PROJECT_DIR/scripts/install-python.sh"'
        basedOnDependencyAnalysis: false
        showEnvVars: false
    scheme:
      testTargets:
        - StowTests
  StowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StowTests
    dependencies:
      - target: Stow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.stow.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Stow.app/Stow"
        BUNDLE_LOADER: "$(TEST_HOST)"
