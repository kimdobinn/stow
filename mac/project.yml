name: Stow
options:
  bundleIdPrefix: dev.stow
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # A stable identity, so macOS keeps Bluetooth and Local Network permissions across rebuilds
    # (an ad-hoc signature is a new app to privacy settings every build).
    CODE_SIGN_IDENTITY: "Apple Development: Dobin Kim (S46UCL28BH)"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: LYD6WV79Y4
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
targets:
  Stow:
    type: application
    platform: macOS
    sources:
      - path: Stow
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: IOBluetooth.framework
      - sdk: IOKit.framework
      - sdk: OpenGL.framework
    info:
      path: Stow/Info.plist
      properties:
        CFBundleDisplayName: Stow
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSApplicationCategoryType: public.app-category.utilities
        NSBluetoothAlwaysUsageDescription: Stow connects your Bluetooth speaker before the morning alarm and keeps it from powering off.
        NSLocalNetworkUsageDescription: While the morning alarm plays, your paired phone controls it over your home Wi-Fi.
        NSBonjourServices:
          - _stow-remote._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.stow.mac
        SWIFT_OBJC_BRIDGING_HEADER: Stow/Player/LibMPV/Stow-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Stow/Player/LibMPV/include
        GCC_PREPROCESSOR_DEFINITIONS: GL_SILENCE_DEPRECATION=1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Stow
    scheme:
      testTargets:
        - StowTests
  StowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StowTests
    dependencies:
      - target: Stow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.stow.mac.tests
        HEADER_SEARCH_PATHS: $(SRCROOT)/Stow/Player/LibMPV/include
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Stow.app/Contents/MacOS/Stow"
        BUNDLE_LOADER: "$(TEST_HOST)"
