name: Stow
options:
  bundleIdPrefix: dev.stow
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
targets:
  Stow:
    type: application
    platform: macOS
    sources:
      - path: Stow
    info:
      path: Stow/Info.plist
      properties:
        CFBundleDisplayName: Stow
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.stow.mac
        PRODUCT_NAME: Stow
    scheme:
      testTargets:
        - StowTests
  StowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StowTests
    dependencies:
      - target: Stow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.stow.mac.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Stow.app/Contents/MacOS/Stow"
        BUNDLE_LOADER: "$(TEST_HOST)"
